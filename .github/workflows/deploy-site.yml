name: deploy-site

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "template/packages/design-system/**"
      - "template/packages/ui/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-site.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/site/**"
      - "template/packages/design-system/**"
      - "template/packages/ui/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  deployments: write

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          job: deploy-site
          verification: "false"
      - name: Typecheck and build marketing site
        run: pnpm turbo run typecheck build --filter=@repo/site
      - name: Deploy to Cloudflare Pages
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '50ad2052bbc6ca528d6993a689b419a4' }}
          DEPLOY_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              echo "::notice::Skipping Cloudflare Pages preview deploy because CLOUDFLARE_API_TOKEN is not configured."
              exit 0
            fi
            echo "::error::CLOUDFLARE_API_TOKEN secret is required to deploy vibestack.fun to Cloudflare Pages."
            exit 1
          fi
          pnpm dlx wrangler pages deploy dist \
            --project-name=vibestack-fun \
            --branch="$DEPLOY_BRANCH" \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=true
