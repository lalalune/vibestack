name: Producer lifecycle baseline
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [codex/producer-lifecycle-control-1123]
    paths: [.github/workflows/fuzz.yml]
  push:
    branches: [codex/producer-lifecycle-control-1123]
    paths: [.github/workflows/fuzz.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-lifecycle-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - name: Hold a pull-request producer and record provenance
        env:
          ABI: ${{ matrix.abi }}
        run: |
          jq -n --arg sha "$GITHUB_SHA" --arg event "$GITHUB_EVENT_NAME" --arg abi "$ABI" '{sha:$sha,event:$event,abi:$abi}' > "$RUNNER_TEMP/receipt.json"
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then sleep 150; fi
      - uses: actions/upload-artifact@v7
        with:
          name: producer-baseline-${{ matrix.abi }}
          path: ${{ runner.temp }}/receipt.json
          retention-days: 3
