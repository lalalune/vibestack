name: release

# A v* tag matching packages/{vibestack,studio,create-vibestack}/package.json builds all three
# packages, runs the tools' self-test through the shared cache (or one task at a time where CI
# has not warmed it), publishes all three packages to npm with OIDC provenance, and attaches
# their .tgz tarballs to the GitHub release (CONTRIBUTING.md, "Releasing").
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: turbo-cache-read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_CACHE: local:rw,remote:r
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install-chromium: both
      - name: Verify package versions match tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in packages/vibestack packages/studio packages/create-vibestack; do
            ver=$(node -p "require('./$pkg/package.json').version")
            test "$ver" = "$tag" || { echo "::error::$pkg version $ver does not match tag $GITHUB_REF_NAME"; exit 1; }
          done
      - run: pnpm build
      - run: pnpm all vibestack#test vibestack-studio#typecheck vibestack-studio#test vibestack-studio#test:browser --concurrency=1
      - run: pnpm selftest --only --concurrency=1
      - name: Pack release tarballs
        run: |
          mkdir -p "$RUNNER_TEMP/release-tarballs"
          pnpm --filter vibestack pack --pack-destination "$RUNNER_TEMP/release-tarballs"
          pnpm --filter vibestack-studio pack --pack-destination "$RUNNER_TEMP/release-tarballs"
          pnpm --filter create-vibestack pack --pack-destination "$RUNNER_TEMP/release-tarballs"
          ls -lh "$RUNNER_TEMP/release-tarballs"
      - name: Publish packages to npm
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for tarball in "$RUNNER_TEMP/release-tarballs"/*.tgz; do
            echo "Publishing $tarball..."
            npm publish "$tarball" --provenance --access public
          done
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-tarballs"/*.tgz --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
