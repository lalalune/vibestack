name: Producer lifecycle candidate
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [codex/producer-lifecycle-control-1123-merged-only]
    paths: [.github/workflows/fuzz.yml]
  push:
    branches: [codex/producer-lifecycle-control-1123-merged-only]
    paths: [.github/workflows/fuzz.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-lifecycle-candidate-${{ github.event.action == 'closed' && (github.event.pull_request.merged != true || github.run_attempt != '1') && format('close-{0}-{1}', github.run_id, github.run_attempt) || github.event_name == 'pull_request' && format('pr-{0}', github.event.number || github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  runtime:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - name: Hold a pull-request producer and record provenance
        env:
          ABI: ${{ matrix.abi }}
        run: |
          jq -n --arg sha "$GITHUB_SHA" --arg event "$GITHUB_EVENT_NAME" --arg abi "$ABI" '{sha:$sha,event:$event,abi:$abi}' > "$RUNNER_TEMP/receipt.json"
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then sleep 150; fi
      - uses: actions/upload-artifact@v7
        with:
          name: producer-candidate-${{ matrix.abi }}
          path: ${{ runner.temp }}/receipt.json
          retention-days: 3
