name: release

# A v* tag matching packages/{vibestack,studio,create-vibestack}/package.json builds all three
# packages, runs the tools' self-test through the shared cache (or one task at a time where CI
# has not warmed it), and attaches both versioned and unversioned latest .tgz tarballs to the
# GitHub release (CONTRIBUTING.md, "Releasing").
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: turbo-cache-read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_CACHE: local:rw,remote:r
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install-chromium: both
      - name: Verify package versions match tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in packages/vibestack packages/studio packages/create-vibestack; do
            ver=$(node -p "require('./$pkg/package.json').version")
            test "$ver" = "$tag" || { echo "::error::$pkg version $ver does not match tag $GITHUB_REF_NAME"; exit 1; }
          done
      - run: pnpm build
      - run: pnpm all vibestack#test vibestack-studio#typecheck vibestack-studio#test vibestack-studio#test:browser --concurrency=1
      - run: pnpm selftest --only --concurrency=1
      - name: Pack release tarballs
        run: |
          tag="${GITHUB_REF_NAME#v}"
          dir="$RUNNER_TEMP/release-tarballs"
          mkdir -p "$dir"
          pnpm --filter vibestack pack --pack-destination "$dir"
          pnpm --filter vibestack-studio pack --pack-destination "$dir"
          pnpm --filter create-vibestack pack --pack-destination "$dir"
          cp "$dir/vibestack-${tag}.tgz" "$dir/vibestack.tgz"
          cp "$dir/vibestack-studio-${tag}.tgz" "$dir/vibestack-studio.tgz"
          cp "$dir/create-vibestack-${tag}.tgz" "$dir/create-vibestack.tgz"
          ls -lh "$dir"
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-tarballs"/*.tgz --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
